<div id="app-container">
  <header id="header">
    <!-- Centered inner bar, width-matched to the terminal panel below -->
    <div class="header-inner">
      <!-- Brand: logo + name on the left -->
      <a class="header-brand" href="{{PREFIX}}">
        <img src="{{PREFIX}}assets/images/ProfilePicture.png" alt="qu3b411 logo" class="header-logo" />
        <span class="brand-name">qu3b411<span class="brand-dim">.tech</span></span>
      </a>
      <!-- Right side controls -->
      <nav class="right-header-links" aria-label="Site navigation">
        <button id="aboutBtn" class="header-btn">About</button>
        <div id="postsDropdownContainer">
          <label for="postsDropdown" class="visually-hidden">Scroll Posts</label>
          <select id="postsDropdown" class="header-btn">
            <option value="" disabled selected>Scroll Posts</option>
          </select>
        </div>
      </nav>
    </div>
  </header>
  <main id="main">
    <div id="terminal" class="terminal-shell">
      <!-- Terminal header with window control buttons -->
      <div class="term-header">
        <span class="window-btn close"></span>
        <span class="window-btn minimize"></span>
        <span class="window-btn maximize"></span>
      </div>
      <!-- Inner surface holds both the terminal view and editor surfaces. It is positioned relative so that
           child views can fill the same viewport. -->
      <div id="terminalSurface" class="term-surface">
        <!-- Container where xterm.js will attach -->
        <div id="term-container" class="term-container"></div>
        <!-- Editor surface that replaces the xterm view when in editor modes -->
        <div id="editor-surface" hidden tabindex="0" role="application" aria-label="Editor mode">
          <!-- VIM in-terminal surface. Panes are built dynamically; the
               command line at the bottom is shared across all windows. -->
          <div id="vimSurface" hidden class="editor-view editor-vim">
            <div id="vimPanes" class="vim-panes vim-panes-row"></div>
            <div id="vimCmdline" class="vim-cmdline" aria-live="polite"></div>
          </div>
          <!-- NANO in-terminal surface -->
          <div id="nanoSurface" hidden class="editor-view editor-nano">
            <div class="nano-titlebar" aria-hidden="true">
              <span class="nano-title-ver">GNU nano 7.2</span>
              <span id="nanoTitleFile" class="nano-title-file">New Buffer</span>
              <span id="nanoTitleMod" class="nano-title-mod"></span>
            </div>
            <div id="nanoContent" class="view-content"></div>
            <div id="nanoMsg" class="nano-msgline" aria-live="polite"></div>
            <div class="nano-bottom-bar" aria-hidden="true">
              <span><b>^G</b> Help</span>
              <span><b>^O</b> Write Out</span>
              <span><b>^W</b> Where Is</span>
              <span><b>^K</b> Cut</span>
              <span><b>^T</b> Execute</span>
              <span><b>^C</b> Location</span>
              <span><b>^R</b> Read File</span>
              <span><b>^\</b> Replace</span>
              <span><b>^U</b> Paste</span>
              <span><b>^/</b> Go To Line</span>
              <span><b>^X</b> Exit</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="footer">
    <nav class="foot-links" aria-label="Footer navigation">
      <a href="{{PREFIX}}">Home</a>
      <span aria-hidden="true">·</span>
      <a href="{{PREFIX}}blog/">Blog</a>
      <span aria-hidden="true">·</span>
      <a href="{{PREFIX}}about/">About</a>
      <span aria-hidden="true">·</span>
      <a href="{{PREFIX}}feed.xml">RSS</a>
    </nav>
    <div class="foot-copy">&copy; 2026 qu3b411.tech</div>
  </footer>
</div>
